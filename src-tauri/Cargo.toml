[package]
name = "amagi-core"
version = "0.9.0"
description = "AMAGI Core Desktop — Agent Memory & Skill Forge"
authors = ["Racious"]
edition = "2021"

[lib]
name = "amagi_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：settings.json 補 outputStyle 欄位重寫時，保留既有鍵順序不重排
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["rt", "macros", "fs"] }
once_cell = "1"
dirs = "5"
sha2 = "0.10"

# Windows 專用：原生 WM_SETICON，讓標題列(ICON_SMALL)用小尺寸乾淨圖、
# 工作列(ICON_BIG)維持高解析。版本對齊既有依賴樹避免重複編譯。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
